[project]
name = "fastapi-backend-template"
version = "0.1.0"
description = "Reusable FastAPI backend template with auth, RBAC, Celery, Redis, and object storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "gunicorn>=26.2.0",
    "python-multipart>=0.0.32",

    # Database
    # The [asyncio] extra is REQUIRED, not cosmetic: plain `sqlalchemy` declares
    # greenlet behind a platform marker (aarch64/x86_64/amd64/win32) that does
    # NOT match Apple Silicon's `arm64`. Without the extra, every async DB call
    # fails locally on an M-series Mac with "the greenlet library is required",
    # while Docker (aarch64) silently works. The extra requires greenlet always.
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",

    # Configuration
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",

    # Authentication & security
    # PyJWT replaces the unmaintained python-jose (FastAPI docs standard).
    # [crypto] keeps RS256/ECDSA available, as python-jose[cryptography] did.
    "pyjwt[crypto]>=2.13.0",
    # pwdlib replaces the unmaintained passlib. Argon2 hashes new passwords;
    # the bcrypt extra stays so existing passlib bcrypt hashes still verify.
    # This also removes the bcrypt<5 pin passlib forced on us.
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "email-validator>=2.3.0",

    # Background tasks
    "celery>=5.6.3",
    "redis>=8.1.0",
    "flower>=2.1.0",

    # HTTP + async utilities (conventions §1, §4, §19)
    # HTTPX is the mandated outbound HTTP client (never Requests).
    "httpx>=0.28.1",
    # Asyncer is the mandated way to bridge sync <-> async (never raw asyncio).
    "asyncer>=0.0.18",

    # CLI utilities
    "typer>=0.27.1",
    "rich>=15.0.0",

    # File handling / object storage
    "boto3>=1.43.81",
    "Pillow>=12.3.0",
    "python-magic>=0.4.27",

    # Data processing (optional — remove if not needed)
    "pandas>=3.0.5",
    "openpyxl>=3.1.5",

    # Monitoring
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]
# Google OAuth is gated behind AUTH_GOOGLE_OAUTH_ENABLED. The provider imports
# google-auth lazily and raises "Google auth library not installed" without it,
# so the feature ships unusable unless this extra is installed:
#   uv sync --extra google
# The [requests] extra is required: google.auth.transport.requests is the
# transport the provider uses, and google-auth does not pull it in by itself.
# This brings in `requests` as google-auth's internal transport — it does not
# relax the conventions §19 rule that OUR outbound HTTP goes through HTTPX.
google = ["google-auth[requests]>=2.57.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle · I = import sorting · UP = pyupgrade
# B = bugbear · ASYNC = blocking-call detection · FAST = FastAPI rules (§1)
select = ["E", "F", "I", "UP", "B", "ASYNC", "FAST"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # Depends()/Query() in defaults is the FastAPI idiom
    # E712 must stay off in a SQLAlchemy codebase. `Model.col == False` is the
    # correct way to build a SQL predicate; ruff's suggested `not Model.col`
    # evaluates in Python and silently produces the wrong query.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the module's public API surface (conventions §2).
"**/__init__.py" = ["F401"]
# This file exists ONLY to import every model so Alembic autogenerate can see
# them (conventions §8). Its imports are "unused" by design — removing them
# would silently break migration generation.
"app/core/alembic_models_import.py" = ["F401"]
