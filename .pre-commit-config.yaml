# Deliberately light: this runs on every commit, so it holds only what is fast and
# only what applies to the files you actually changed.
#
# The doc checker and the convention tests are CI's job (.github/workflows/ci.yml) —
# they need the whole tree to mean anything, and a slow pre-commit is one people disable.
#
#   uv run pre-commit install       # once, per clone
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Keeps NEW code clean while the inherited baseline is worked down separately.
      # See the note in .github/workflows/ci.yml.
      - id: ruff-check
        args: [--fix]
      # v0.17.0 added `markdown` to this hook's types, so editing any doc would also reformat
      # its code samples — teaching snippets laid out on purpose — and bury the doc change in
      # that churn. Scoped back to code; format a doc's samples deliberately if you want to.
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$          # trailing spaces are meaningful line breaks in markdown
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
